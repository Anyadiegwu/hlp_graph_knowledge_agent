[project]
name = "mcp_server"
version = "0.2.0"
description = "FastMCP server — Reflection tool (MCP Sampling) + Hierarchical CRAG resource"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0",
    "langchain-tavily>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tenacity>=9.1.4",
]

[project.scripts]
start-server = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
