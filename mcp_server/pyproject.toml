[project]
name = "mcp_server"
version = "0.2.0"
description = "FastMCP server — Reflection tool (MCP Sampling) + Hierarchical CRAG resource"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0",
    "langchain-tavily>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=2.4.6",
    "redisvl>=0.23.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "httpx>=0.27.0",
    "x402_core",
]

[tool.uv.sources]
x402_core = { workspace = true }

[project.scripts]
start-server = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]