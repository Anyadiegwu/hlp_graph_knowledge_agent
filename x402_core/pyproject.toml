[project]
name = "x402_core"
version = "0.1.0"
description = "Shared x402 stablecoin billing + Algorithmic FinOps governance primitives for the HLP monorepo."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "eth-account>=0.13.0",
    "redis>=7.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
