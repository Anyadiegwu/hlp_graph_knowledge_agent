[project]
name = "agent_client"
version = "0.4.0"
description = "LangChain ReAct agent — MCP Client with RunnableWithRetry, RunnableWithFallbacks, dual-stream logging."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "redis>=7.4.1",
    "langchain-redis>=0.2.5",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
start-agent = "agent_client.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_client"]
