[project]
name = "analysis_dashboard"
version = "0.1.0"
description = "HLP Log Analysis Agent — semantic search, Neo4j knowledge graph, trend analytics, Streamlit dashboard"
requires-python = ">=3.11"
dependencies = [
    # Core agent framework
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # SQLite store (reads logs written by agent_client)
    "aiosqlite>=0.19.0",
    # Neo4j graph database
    "neo4j>=5.0.0",
    # Analytics and visualisation
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # Dashboard
    "streamlit>=1.35.0",
    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
start-dashboard = "analysis_dashboard.app:main"
start-analysis-agent = "analysis_dashboard.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_dashboard"]
